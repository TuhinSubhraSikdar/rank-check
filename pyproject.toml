[project]
name = "ranktracker"
version = "0.1.0"
requires-python = ">=3.10"
description = "Tenant-isolated geographical organic rank tracking"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

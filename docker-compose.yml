services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ranktracker}
      POSTGRES_USER: ${POSTGRES_USER:-ranktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ranktracker} -d ${POSTGRES_DB:-ranktracker}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [static_data:/app/staticfiles, media_data:/app/media]
  worker:
    build: .
    command: celery -A config worker --loglevel=INFO --concurrency=1
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  beat:
    build: .
    command: celery -A config beat --loglevel=INFO
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on: [web]
volumes:
  postgres_data:
  static_data:
  media_data:

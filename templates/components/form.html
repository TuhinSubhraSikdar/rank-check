{% if form.non_field_errors %}<div role="alert" class="notice error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}</div>{% endfor %}
